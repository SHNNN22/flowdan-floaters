<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#dcecf7">
  <title>Flowdan Floaters</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <main id="app">
    <div id="canvas-holder" aria-label="Interactive Flowdan floaters"></div>

    <section class="ui" aria-live="polite">
      <h1>Flowdan Floaters</h1>
      <p>Swipe quickly. The figures lag behind, drift and settle.</p>
      <button id="reset-button" type="button">Reset floaters</button>
    </section>
  </main>

  <script src="sketch.js"></script>
</body>
</html>
