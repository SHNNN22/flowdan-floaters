<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Flowdan Floaters</title>
  <meta name="description" content="A p5.js eye-floater simulation using a transparent Flowdan image." />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
  <main>
    <div id="canvas-holder" aria-label="Interactive Flowdan floaters canvas"></div>
    <section class="ui" aria-label="Instructions">
      <h1>FLOWDAN FLOATERS</h1>
      <p>Move the cursor or drag your finger.</p>
      <p><kbd>R</kbd> resets the floaters · <kbd>H</kbd> hides this panel</p>
    </section>
  </main>
  <script src="sketch.js"></script>
</body>
</html>
